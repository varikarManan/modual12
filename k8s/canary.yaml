apiVersion: apps/v1
kind: Deployment

metadata:
  name: canary-v1

spec:
  replicas: 9

  selector:
    matchLabels:
      app: canary-demo
      version: v1

  template:

    metadata:
      labels:
        app: canary-demo
        version: v1

    spec:

      containers:

      - name: app

        image: manan0077/devops_mode_12:5

        env:

        - name: VERSION
          value: "v1"

        - name: FEATURE_ENABLED
          value: "false"

        ports:
        - containerPort: 3000
