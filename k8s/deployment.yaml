apiVersion: apps/v1
kind: Service
metadata:
  name: devops-demo-service

spec:

  replicas: 3

  selector:
    matchLabels:
      app: devops-demo

  template:

    metadata:
      labels:
        app: devops-demo

    spec:

      containers:

      - name: devops-demo

        image: manan0077/devops_mode_12:5

        ports:
        - containerPort: 3000

        env:

        - name: VERSION
          value: "v1"

        - name: FEATURE_ENABLED
          value: "false"
